<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Muznik — Android</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f2f2f7; background: radial-gradient(circle at 30% 20%, #2c1d1a, #0b0b0d 60%);
    }
    main {
      width: min(420px, calc(100% - 32px)); padding: 28px;
      background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12);
      border-radius: 24px; box-shadow: 0 20px 60px rgba(0,0,0,.45);
    }
    h1 { margin: 0 0 4px; font-size: 32px; letter-spacing: -.5px; }
    .sub { color: #98989f; margin: 0 0 22px; }
    .version { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    .notes { color: #b8b8bf; margin: 0 0 22px; }
    a.button {
      display: block; text-align: center; text-decoration: none; font-weight: 700;
      padding: 14px 18px; border-radius: 14px; color: #fff;
      background: linear-gradient(135deg, #f06a56, #d94f3d);
    }
    a.button:active { transform: scale(.98); }
    code {
      display: block; margin-top: 20px; padding: 10px; border-radius: 10px;
      background: rgba(0,0,0,.35); color: #d9d9df; font-size: 12px; word-break: break-all;
    }
    .hint { color: #7b7b82; font-size: 12px; margin-top: 12px; }
  </style>
</head>
<body>
  <main>
    <h1>Muznik</h1>
    <p class="sub">Музыка без лишних экранов — Android-сборка</p>
    <div class="version" id="version">Загрузка версии…</div>
    <p class="notes" id="notes"></p>
    <a class="button" id="download" href="Muznik.apk">Скачать APK</a>
    <code id="url"></code>
    <p class="hint">В приложении: Настройки → Обновление → Адрес update.json — вставьте адрес этого файла.</p>
  </main>
  <script>
    fetch('update.json', { cache: 'no-store' })
      .then(r => r.ok ? r.json() : Promise.reject(new Error('Нет update.json')))
      .then(j => {
        document.getElementById('version').textContent = 'Версия ' + (j.versionName || j.versionCode);
        document.getElementById('notes').textContent = j.notes || '';
      })
      .catch(() => {
        document.getElementById('version').textContent = 'Версия на сайте';
      });
    document.getElementById('url').textContent = location.href.replace(/index\.html?$/, '') + 'update.json';
  </script>
</body>
</html>
